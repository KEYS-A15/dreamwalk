name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10
        with:
          version: latest-known
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv build --wheel
